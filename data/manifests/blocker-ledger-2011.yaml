# Canonical blocker ledger for the 2011 unified booklet (PROMPT Phase 2C
# section 3). baseline_count records the Phase 2B readiness gate's own
# printed total (32) as a historical fact, not a target - see
# src/enade/extraction/blocker_ledger.py.
baseline_count: 32
blockers:
  # --- Structural blocker groups (13 baseline entries) -----------------
  - id: q09-math-notation-loss
    question_id: enade-2011-computing-q09
    category: math-notation
    source_pages: [9]
    description: >-
      Property (iii), the quotient-set paragraph, and analysis items I-IV
      were missing or reduced to bare fragments.
    cause: >-
      Small embedded raster-image formulas chain-absorbed into a region
      with no concept of ownership, excluding the surrounding real prose
      as if it were figure content (PROMPT Phase 2C section 6-11/13-18).
    status: open
    resolution: >-
      PARTIALLY IMPROVED (Phase 2C, ownership model + small-formula
      handling): property (iii), the quotient-set paragraph+formula, and
      items I/II/IV are now present. Residual: the canonical-projection
      sentence still ends at "A funcao" with nothing after it.
    evidence: data/manifests/visual-audit-2011-computing.json#enade-2011-computing-q09
    affected_assets:
      - enade-2011-computing-q09/figure-01.png
      - enade-2011-computing-q09/figure-02.png
      - enade-2011-computing-q09/figure-03.png
      - enade-2011-computing-q09/figure-04.png
    regression_tests: [tests/test_ownership.py]
    visual_validation: failed
  - id: q10-fraction-numerators-lost
    question_id: enade-2011-computing-q10
    category: math-notation
    source_pages: [9]
    description: >-
      All 5 alternatives are stacked two-line fractions; every numerator
      is missing, alternatives render as bare denominators only.
    cause: >-
      Each alternative's fraction is real TEXT (a numerator line above the
      marker, a denominator line below - PyMuPDF never emits a slash
      glyph). The denominator merges with the marker via the existing
      orphan-marker pass; the numerator is left as a standalone bare-digit
      line, which chrome.py's text-only running-page-number heuristic then
      strips before it reaches alternative-building.
    status: open
    resolution: >-
      A general fix (second merge pass, opposite-side bare-digit search)
      was implemented and correctly reconstructed all 5 fractions, but was
      REJECTED after full 2021 regression testing found a real false
      positive (2021 Q34's Dijkstra graph node-label listing - see
      docs/decisions.md, Phase 2C ADR 30) and fully reverted. Remains
      unresolved.
    evidence: docs/decisions.md#phase-2c-adr-30
    affected_assets: []
    regression_tests: [tests/test_extraction_layout.py]
    visual_validation: failed
  - id: q12-grammar-block-missing
    question_id: enade-2011-computing-q12
    category: math-notation
    source_pages: [10]
    description: >-
      Intro sentence's symbol names, the full BNF grammar, and analysis
      items were missing or fragmentary.
    cause: >-
      Same chain-absorption mechanism as Q09, compounded by a since-removed
      Level-3 override (ADR 22) that suppressed the whole spurious region
      (and, with it, this real content) to protect Q11/Q13.
    status: open
    resolution: >-
      DRAMATICALLY IMPROVED (Phase 2C): removing the now-redundant Q13
      override and relying on ownership+formula-tight-merge recovered the
      complete intro sentence, full grammar, and items I-III as one
      correctly-scoped visual-fallback image. Residual: item IV's own
      opening text is neither in the image nor in the surviving prose.
    evidence: data/manifests/visual-audit-2011-computing.json#enade-2011-computing-q12
    affected_assets:
      - enade-2011-computing-q12/figure-01.png
    regression_tests: [tests/test_ownership.py, tests/test_layout_overrides.py]
    visual_validation: failed
  - id: q14-alternatives-empty
    question_id: enade-2011-computing-q14
    category: math-notation
    source_pages: [11]
    description: All 5 alternatives render as empty ("A. ." ... "E. .").
    cause: >-
      Each alternative's own boolean-algebra formula is a small embedded
      raster image; the alternative-building path is text-only (marker
      regex) and has no mechanism to attach an inline image to a specific
      alternative's own text.
    status: open
    resolution: >-
      PARTIALLY IMPROVED (Phase 2C): the formulas are now confirmed
      present, complete, legible, and correctly owned (figure-02.png shows
      all 5), but not yet placed inline per-alternative ("no local
      correto" not yet satisfied, PROMPT Phase 2C section 16). Extending
      ExtractedAlternative to carry an optional formula-asset reference
      was scoped but not implemented this phase.
    evidence: data/manifests/visual-audit-2011-computing.json#enade-2011-computing-q14
    affected_assets:

    http://www.ipea.gov.br") bled in from the figure''s own citation, previously not called out.
    ROOT-CAUSED PRECISELY IN PHASE 3G, MINOR REGRESSION DOCUMENTED (not hidden): direct instrumentation
    against page 4 confirms the Lorenz-curve figure''s own VisualRegion genuinely absorbs almost the entire
    framing paragraph via figures.py''s own pre-existing, multi-pass label-growth chain (TEXT_ABSORPTION_PADDING''s
    90pt vertical tolerance lets the region cascade downward through consecutive short PyMuPDF line-fragments
    of the same paragraph) - every fragment is a genuine entry in the region''s own absorbed_label_bboxes, so
    Phase 3G''s new matches_absorbed_label signal (added to keep Q61/2011/2021 correct) faithfully trusts
    growth''s decision even where growth itself over-reaches. This is the same family already named above,
    now precisely diagnosed; Phase 3G''s own change does not introduce it, but removes the old fixed-padding
    logic''s incidental partial mitigation for this question specifically - confirmed by diff against HEAD
    that the word ''aos'' (part of ''aos 20% de maior renda foi,'') is now also absorbed, where it previously
    survived. Marginal, same-family worsening of an already-severe defect, not a new category of harm or a
    pass/fail flip. A general fix would require bounding or re-weighting matches_absorbed_label against
    growth''s own cascade depth, not a per-case threshold; not attempted this phase given the risk of
    reopening the 2011/2021 regression this signal was built to close.
    ROOT-CAUSED AND MOSTLY FIXED IN PHASE 3H (Cluster D): the "cascade" was, precisely, PyMuPDF''s own
    get_text("dict") reporting this one printed line as eight separate same-baseline dict-mode "line"
    entries (''total'', ''correspondente'', ''aos'', ''20%'', ''de'', ''maior'', ''renda'', ''foi,'') - each
    individually short enough to look like a label. fragment_reconstruction_gate rejoins them (documentary
    trailing-space + safe-gap evidence), and a companion fix excludes any fragment-merged line from
    figures.py''s own label_candidates outright (the merged line, still narrower than MAX_LABEL_LINE_WIDTH
    by coincidence, was otherwise absorbed as ONE unit - worse than the pre-merge fragments). Confirmed by
    full regeneration: statement now reads ''total correspondente aos 20% de maior renda foi,'' - recovered
    beyond even the pre-Phase-3G HEAD state. Zero 2011/2021 drift (the same mechanism, tested
    unconditionally, correctly fixed an unrelated, already-documented 2021 defect - see
    fragment_reconstruction_gate''s own docstring - but stays gated regardless). Residual, NOT Cluster D:
    the earlier framing clause (''De acordo com o mesmo gráfico, o percentual da renda'') is one single,
    non-fragmented line that growth still genuinely absorbs on its own - same pre-existing over-absorption
    family as D09/D10/D40/Q02/Q05/Q45/Q54; alternative E''s own citation contamination also remains.'
  description: 'RESOLVED IN PHASE 3P (framing clause already RESOLVED IN PHASE 3O): statement now reads

blockers:
- affected_assets: []
  category: region-merge-content-loss
  cause: 'PARTIALLY ROOT-CAUSED AND FIXED IN PHASE 3C. The catastrophic part of this defect was a genuine
    generalization gap in figures.py''s own _merge_by_vertical_proximity: it merged vector-drawing candidates
    by Y-proximity alone, with no X-axis check. This booklet''s own per-question RASCUNHO (scratch-answer)
    ruled writing grid is drawn as many short vector row-border segments whose left-column segments (x0~37-60)
    and right-column segments (x0~558-559, ~500pt further right) recur at the same Y pitch - close enough
    vertically to merge, never close enough horizontally to plausibly be the same drawing. Confirmed by direct
    instrumentation against 2008/b1_prova.pdf page 6: 41 such grid segments were collapsing into one
    (36.8, 587.3, 559.2, 760.1) region, trivially X-overlapping every real text line on the page and
    (via label absorption) swallowing the entire statement. Fixed by requiring X-closeness too (MERGE_X_TOLERANCE,
    figures.py), gated to this booklet alone via ExamStructureProfile.region_merge_x_tolerance (2011/2021 do
    not set this field and are unaffected - confirmed by full regeneration, zero drift on all 288 protected
    files). A SEPARATE, still-unresolved defect remains after this fix: this page''s own real embedded photo
    sits directly below a short article headline (''DIREITOS HUMANOS EM QUESTAO'', real content, not a caption)
    which is itself absorbed into the photo''s region on pass 1 of _expand_with_labels (indistinguishable, by
    proximity/width alone, from a legitimate diagram label), and most of the accompanying quote/article body
    is absorbed on subsequent cascading passes. A caption/consumption-separation fix (PROMPT Phase 3C section
    7-9) was investigated but not attempted this phase - see docs/phase-3c-report.md section E for why it
    could not be done safely without risking 2011/2021 in the time available.'
  description: 'RESOLVED IN PHASE 3D: statement is now complete, matching page 6''s own raw PDF text
    extraction word for word (headline, full quote with inline attribution, all three bulleted items,
    closing instruction and valor line).'
  evidence: docs/phase-3c-report.md section E; docs/phase-3d-report.md section D; tests/test_extraction_figures.py
    (region-merge X-axis and caption-font-size-gate tests); tests/test_extraction_pipeline_2008.py::test_d09_statement_is_now_complete
  id: d09-region-merge-content-loss
  question_id: enade-2008-computing-d09
  regression_tests:
  - tests/test_extraction_figures.py
  - tests/test_extraction_pipeline_2008.py
  resolution: 'RESOLVED (Phase 3D): root-caused precisely - this booklet''s own real captions/citations are
    consistently set in a font SMALLER than body prose (this page''s own photo credit: 6pt vs. a 10pt body),
    while the headline shares the body''s own font-adjacent size (11pt, matching the page''s own ''QUESTAO 9''
    marker) - font size, not just geometry, is what actually distinguishes a real header from a real caption.
    Fixed via a new, opt-in caption_font_size_gate (figures.py/exam_profile.py), requiring a label-absorption
    candidate''s own font size to be strictly smaller than the page''s own dominant body-prose font size
    (figures._dominant_body_font_size). Gated to 2008-b alone via ExamStructureProfile.caption_font_size_gate
    (2011/2021 do not set this field and are unaffected - confirmed by full regeneration, zero drift on all
    288 protected files; an earlier unconditional-default attempt was found to alter 2011''s own Q05/Q33/Q34/Q35
    and was reverted in favor of this declarative gate - see docs/phase-3d-report.md section E).'
  source_pages:
  - 6
  status: resolved
  superseded_by: null
  visual_validation: passed

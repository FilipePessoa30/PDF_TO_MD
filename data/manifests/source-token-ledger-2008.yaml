# Source-token ledger (PROMPT Fase 3Q, Section 8).
#
# Machine-readable record of individual tokens whose textual fidelity
# required low-level adjudication (rawdict/texttrace/font-fingerprint
# evidence) before being restored to canonical text - distinct from
# layout-overrides.yaml (which documents *where* a line is protected from
# region-membership exclusion) and blocker-ledger-2008.yaml (which
# documents the *causal narrative* of each defect). This ledger documents
# *token identity itself*: charcode, glyph ID, font fingerprint, and the
# exact backend evidence that proves a character is what it appears to be,
# independent of whether the correction mechanism (override, general fix,
# glyph mapping, or visual fallback) is documented elsewhere.
#
# Never used to justify a correction by itself - see layout-overrides.yaml
# for the actual `protect_from_region_membership` entries this evidence
# supports. A token entry exists purely as an auditable identity record.

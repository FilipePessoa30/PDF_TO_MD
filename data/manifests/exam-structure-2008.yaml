# Declarative structure profile for the 2008 unified "COMPUTACAO" booklet,
# course letter "b" (PROMPT Phase 3A - the legacy-layout pilot booklet).
#
# Confirmed directly against the real PDF, not assumed from the brief:
#   - data/raw/geacc-enade/2008/b1_prova.pdf page 1's own cover ("PROVA DE
#     COMPUTACAO", instruction table) - the cover is a single embedded
#     raster image with *no* extractable text layer at all, so the ranges
#     below were read visually from the rendered page, then independently
#     cross-checked against two other, textual sources:
#       - page 11's own "Componente Especifico" transition paragraph, which
#         repeats the three course-specific ranges in real selectable text
#         (see enade.extraction.exam_profile._RANGE_PATTERNS_2008_B, and
#         verify_declared_profile(doc, instructions_page=11, ...), run
#         automatically on every extraction of this booklet);
#       - the gabarito (b2_gabarito.pdf), whose own 80 numbered entries
#         (1..80, "Discursiva" in place of a letter for every discursive
#         item) independently confirm both the total range and exactly
#         which numbers are discursive: 9, 10, 20, 39, 40, 59, 60, 79, 80 -
#         precisely the nine discursive numbers the ranges below produce.
#
# Two structural differences from 2011's own profile (see
# docs/decisions.md and docs/phase-3a-report.md for the full narrative):
#   1. This booklet's own discursive markers ("QUESTAO N - DISCURSIVA")
#      reuse the *same* printed number stream as its objectives, unlike
#      2011's independent "QUESTAO DISCURSIVA 1".."5" run - hence
#      `combined_numbering: true` (see boundaries.detect_question_boundaries).
#   2. Every specific-course discursive pair (39/40, 59/60, 79/80) belongs
#      to that course alone, unlike 2011 where all discursives are shared
#      Componente Comum content - there is no cross-course discursive
#      sharing in this booklet.
#
# `region_merge_x_tolerance` (PROMPT Phase 3C): this booklet's own per-question
# RASCUNHO (scratch-answer) ruled grid is drawn as many short vector row-border
# segments whose left- and right-column segments recur at the same Y pitch
# ~500pt apart in X - confirmed by direct instrumentation against
# b1_prova.pdf page 6 (Discursiva 9) to collapse into one nearly-full-page-width
# region under the general (unbounded) merge, which then absorbs the real
# statement text via label-absorption (blocker d09-region-merge-content-loss).
# 150pt rejects that ~500pt gap while staying generous relative to this
# booklet's own widest confirmed legitimate single-cluster figure footprint
# (~250pt). Confirmed by full regeneration to leave 2011 and 2021 unaffected
# (neither sets this field, so both keep the original unbounded behavior).
#
# `caption_font_size_gate` (PROMPT Phase 3D): this booklet's own real
# captions/citations are consistently set smaller than body text (D9's own
# photo credit: 6pt vs. a 10pt body), while a real section header/headline
# shares or exceeds the body's own size (D9's own "DIREITOS HUMANOS EM
# QUESTAO" headline: 11pt) - requiring strictly-smaller-than-body font size
# for absorption eligibility keeps real headers out of figure regions.
# Confirmed by full regeneration to leave 2011 unaffected only when gated
# here (an earlier, unconditional-default attempt changed 2011's own
# Q05/Q33/Q34/Q35 - crop-boundary/structural-warning shifts, no statement
# text change - and was reverted in favor of this declarative gate).
#
# `owner_exclusion_gate` (PROMPT Phase 3F): this booklet's own layout can
# legitimately overflow a single alternative into the top of the next page
# column (Q13's own alternative E, printed above Q14's own text because it
# did not fit below D in Q13's own column) - widening that question's own
# coarse bounding box enough to trivially satisfy the ownership-agnostic
# y/x tolerance for a neighboring question's own owned visual region
# (Q12's own control-flow-graph diagram was being published as Q13's own
# figure-01.png, byte-identical to Q12's, despite the two sharing nothing -
# blocker q13-cross-question-image-contamination). Rejecting a region
# explicitly owned by a different question closes this regardless of
# bounding-box overlap. Confirmed by full regeneration to leave 2011/2021
# unaffected only when gated here (an unconditional-default attempt changed
# 2011's own Q34 - a structural-warning/frontmatter-status shift with a
# documented false-positive precedent, no statement text or asset change -
# but a byte-for-byte change to a protected corpus is never accepted
# regardless of characterization, so it was reverted in favor of this
# declarative gate).
year: 2008
exam_type: unified
exam_id: enade-2008-b-computacao
id_shorthand: computing
source_letter: b
combined_numbering: true
region_merge_x_tolerance: 150.0
caption_font_size_gate: true
owner_exclusion_gate: true
sections:
  - id: formacao-geral-objetiva
    kind: objective
    range: [1, 8]
    applicable_courses: [all-computing]
  - id: formacao-geral-discursiva
    kind: discursive
    range: [9, 10]
    applicable_courses: [all-computing]
  - id: nucleo-comum-objetiva
    kind: objective
    range: [11, 19]
    applicable_courses: [all-computing]
  - id: nucleo-comum-discursiva
    kind: discursive
    range: [20, 20]
    applicable_courses: [all-computing]
  - id: cc-bacharelado-objetiva
    kind: objective
    range: [21, 38]
    applicable_courses: [ciencia-da-computacao-bacharelado]
  - id: cc-bacharelado-discursiva
    kind: discursive
    range: [39, 40]
    applicable_courses: [ciencia-da-computacao-bacharelado]
  - id: engenharia-computacao-objetiva

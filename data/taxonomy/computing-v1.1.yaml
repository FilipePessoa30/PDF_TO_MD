  - id: seguranca-da-informacao
    name: Segurança da Informação
    description: Criptografia, protocolos de comunicação segura, e princípios/normas de segurança da informação.
    inclusion_criteria:
      - "Criptografia, autenticação, protocolo de segurança (SSL/TLS/HTTPS), ou princípio normativo de segurança da informação (confidencialidade/integridade/disponibilidade/legalidade/autenticidade, ISO 27002) como objeto central."
    source_references:
      - title: "enade-2008-computing-q42 (sessão SSL sobre HTTPS); enade-2021-cc-b-q24 (criptografia ponta a ponta); enade-2021-si-q25 (ISO 27002)."
    topics:
      - id: criptografia-e-protocolos-seguros
        name: Criptografia e Protocolos Seguros
        source_references:
          - title: "enade-2008-computing-q42; enade-2021-cc-b-q24"
      - id: principios-de-seguranca-da-informacao
        name: Princípios de Segurança da Informação
        description: Confidencialidade, integridade, disponibilidade, legalidade, autenticidade - normas como a ABNT NBR ISO/IEC 27002.
        source_references:
          - title: "enade-2021-si-q25 (ABNT NBR ISO/IEC 27002)"
        concepts:
          - id: legalidade-e-autenticidade-da-informacao
            name: Legalidade e Autenticidade da Informação
            description: >-
              Princípios de segurança da informação além da tríade CID:
              legalidade (conformidade legal da informação produzida) e
              autenticidade (garantia de que um remetente é quem diz ser)
              - itens IV e V de enade-2021-si-q25, que a Fase 5A não
              cobriu com um concept próprio (apenas os itens I-III/CID
              tinham um concept associado).
            keywords: ["legalidade", "autenticidade", "nao-repudio"]
            source_references:
              - title: >-
                  Motivado pela auditoria adversarial da Fase 5B:
                  enade-2021-si-q25 testa 5 afirmações (I-V), não apenas a
                  tríade CID (I-III) que o concept
                  principios-cid-confidencialidade-integridade-disponibilidade
                  já cobria - IV (legalidade) e V (autenticidade) ficavam
                  sem cobertura conceitual própria.
          - id: principios-cid-confidencialidade-integridade-disponibilidade
            name: Princípios CID (Confidencialidade, Integridade, Disponibilidade)
            keywords: ["CID", "confidencialidade", "integridade", "disponibilidade", "ISO 27002"]
            source_references:
              - title: "Motivado pelo piloto Fase 5A: enade-2021-si-q25"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enade-platform"
version = "0.1.0"
description = "Open-source ENADE study platform - Phase 0: foundation, corpus inventory, and data contracts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ENADE Platform Contributors" }]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
enade = "enade.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/enade"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["enade"]

[tool.ruff.lint.flake8-bugbear]
# Typer's `typer.Option(...)`/`typer.Argument(...)` in argument defaults is the
# documented idiom for declaring CLI options - not the mutable-default footgun B008 flags.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
